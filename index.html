<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture It · P3 Maths</title>
  <meta name="description" content="Paste a screenshot of a maths question and get a little app that helps you see it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='22' width='34' height='14' rx='4' fill='%23A5D6A7'/%3E%3Crect x='40' y='22' width='18' height='14' rx='4' fill='%23C8E6C9'/%3E%3Cpath d='M6 46 h52' stroke='%23333' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=1.2.1">
  <link rel="stylesheet" href="board.css?v=1.2.1">
  <link rel="modulepreload" href="app.js?v=1.2.1">
</head>
<body>
  <header class="polymath-header">
    <img src="https://dl.dropboxusercontent.com/scl/fi/h40yjlyg8ldefwfaa3dib/polymath-logo-sticker.png?rlkey=o1ra4taqy79gt9t8u096v82zj"
         alt="Polymath Learning Centre" class="polymath-logo">
    <div class="brand">
      <span class="brand-title">Picture It</span>
      <span class="brand-sub">P3 Maths · see it before you solve it</span>
    </div>
    <div class="header-spacer"></div>
    <span class="version-badge" id="versionBadge" data-tooltip="The version you are running">v1.2.1</span>
  </header>

  <main class="board">
    <p class="board-empty" id="emptyNote" hidden>Nothing here yet. Press <strong>+ Add a question</strong> to start.</p>
    <div class="board-list" id="blocks" aria-live="polite"></div>
    <div class="board-add-row">
      <button type="button" class="board-add" id="addQuestion">+ Add a question</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js?v=1.2.1"></script>
</body>
</html>
